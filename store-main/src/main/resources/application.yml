server:
  port: 8080

spring:
  profiles:
    active: dev
    # 激活 dev 时同时激活 local，从而加载 application-local.yml（邮箱等敏感项，勿提交）
    group:
      dev:
        - dev
        - local
  main:
    allow-circular-references: true
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  datasource:
    druid:
      driver-class-name: ${store.datasource.driver-class-name}
      url: jdbc:mysql://${store.datasource.host}:${store.datasource.port}/${store.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${store.datasource.username}
      password: ${store.datasource.password}
      # 连接池配置
      min-idle: 5
      max-active: 20
      initial-size: 5
      # 连接空闲超时时间（毫秒）
      time-between-eviction-runs-millis: 60000
      # 最小生存时间
      min-evictable-idle-time-millis: 300000
      # 验证查询语句
      validation-query: SELECT 1
      # 获取连接时验证
      test-on-borrow: true
      test-while-idle: true
      # 移除废弃连接的超时时间（毫秒）
      remove-abandoned: true
      remove-abandoned-timeout: 1800
  redis:
    host: ${store.redis.host:127.0.0.1}
    port: ${store.redis.port:6379}
    database: ${store.redis.database:15}
  # 设置单个文件最大大小为10MB
  servlet:
    multipart:
      max-file-size: 10MB
  # 设置总请求数据最大大小为10MB
      max-request-size: 10MB



  mybatis-plus:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.PTU.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      PTU:
        mapper: debug
        service: info
        controller: info

store:
  redis:
    # 逻辑库 0–15；默认 15 专用于本项目，避免与其它使用 db0 的应用混用键空间
    host: 127.0.0.1
    port: 6379
    database: 15

  jwt:
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: itcast
    # 设置jwt过期时间
    admin-ttl: 7200000
    # 设置前端传递过来的令牌名称
    admin-token-name: token

    user-secret-key: bookstore
    user-ttl: 7200000
    user-token-name: authentication

  alioss:
    endpoint:  ${store.alioss.endpoint}
    access-key-id: ${store.alioss.access-key-id}
    access-key-secret: ${store.alioss.access-key-secret}
    bucket-name: ${store.alioss.bucket-name}

  ai:
    # OpenAI 兼容接口：默认阿里百炼通义千问；亦可硅基/DeepSeek/智谱，见 application-dev.yml
    enabled: false
    api-key: ${DASHSCOPE_API_KEY:${SILICONFLOW_API_KEY:${STORE_AI_API_KEY:}}}
    chat-url: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
    model: qwen-turbo

  mail:
    # 开发环境可在 application-dev.yml 中改为 true，验证码仅打印在服务端日志
    mock: false
    # 真实发信时需配置 spring.mail.*，且与 SMTP 要求一致
    from: ""

  alipay:
    appid: ${store.alipay.appid}
    merchantPrivateKey: ${store.alipay.merchantPrivateKey}
    alipayPublicKey: ${store.alipay.alipayPublicKey}
    notifyUrl: ${store.alipay.notifyUrl}
    returnUrl: ${store.alipay.returnUrl}
    signType: ${store.alipay.signType}
    charset: ${store.alipay.charset}
    # 我的支付宝网关地址
    gatewayUrl: ${store.alipay.gatewayUrl}

