# 开发环境：错误 JSON 中带 message，便于排查（表结构已正确却仍 500 时请看控制台与下方 message）
server:
  error:
    include-message: always
    include-binding-errors: always

store:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: localhost
    port: 3306
    database: bookstore
    username: root
    password: 123456

  alioss:
    endpoint: oss-cn-hangzhou.aliyuncs.com
    access-key-id: ${ALIYUN_ACCESS_KEY}
    access-key-secret: ${ALIYUN_SECRET_KEY}
    bucket-name: ptu-bookstore

  redis:
    host: localhost
    port: 6379
    database: 10


